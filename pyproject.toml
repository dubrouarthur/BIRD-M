[project]
name = "bird-medium"
version = "0.1.0"
description = "Bird-Medium: modèle français pour les tâches d'entreprise, fine-tuné depuis Qwen"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyyaml>=6", "pyarrow>=15", "huggingface_hub>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "transformers>=5.2"]

[tool.setuptools]
packages = ["bird_medium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
