# BIRD-M — taxonomie des tâches d'entreprise (source de vérité, docs/TASKS.md est généré)
# priority : P0 = cœur v1 (fort volume, faible coût) · P1 = v1 si budget · P2 = v1.1
# thinking : direct = sans raisonnement · short = raisonnement court · full = raisonnement complet
# eval     : judge (LLM-juge + grille) · json_schema · formula_exec · grammar · exact · routing · pairwise
# Toutes les tâches existent en FR et en EN (+ traduction croisée quand pertinent).

domains:
  redaction: Rédaction & communication
  correction: Correction, réécriture & traduction
  presentation: Présentations & documents structurés
  synthese: Synthèse, extraction & analyse documentaire
  donnees: Données, tableurs & SQL
  rh_juridique: RH, juridique & administratif (France)
  commercial: Commercial, marketing & appels d'offres
  finance: Finance & comptabilité
  projet: Gestion de projet & organisation
  support: Relation client & support
  agentique: Outils, skills & sorties structurées
  confiance: Fiabilité, sécurité & conformité

