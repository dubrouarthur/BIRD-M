    body: |
      Plafonds : repas {repas} € TTC, hôtel {hotel_paris} € à Paris et {hotel_province} € en région, train en 2de classe.
      Justificatifs originaux obligatoires, saisie sous {delai} jours, validation par le manager direct.
    requests:
      fr:
        [
          "Combien je peux me faire rembourser pour un dîner client ?",
          "J'ai dormi à Lyon pour un salon, l'hôtel coûtait 140 €, c'est remboursé ?",
