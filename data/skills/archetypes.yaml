# Archétypes de skills d'entreprise pour générer les épisodes BSP (routage, application, composition).
# - family : les archétypes d'une même famille sont des distracteurs proches les uns des autres
# - split  : train | bench (bench = skills JAMAIS vues à l'entraînement → mesure de généralisation)
# - body   : gabarit instancié par entreprise ({params} tirés dans `params`) ; injecté en contexte, jamais entraîné
# - requests : demandes utilisateur qui DOIVENT déclencher la skill (graines, paraphrasées ensuite par le teacher)

archetypes:
  - key: relance-impayes
    family: recouvrement
    split: train
    type: procedure
    description:
      {
        fr: "Relance des factures clients impayées selon la procédure de recouvrement en niveaux.",
        en: "Chasing unpaid customer invoices following the staged collection procedure.",
      }
    when_to_use:
      {
        fr: "Un client n'a pas payé une facture échue.",
        en: "A customer has not paid an overdue invoice.",
      }
    params:
      {
        j1: [7, 10, 15],
        j2: [21, 30],
        j3: [45, 60],
        signature:
          [
            "Service Comptabilité Clients",
            "Direction financière",
            "Service Recouvrement",
          ],
      }
    body: |
      1. Niveau 1 (J+{j1}) : ton courtois, rappel du numéro de facture, du montant TTC et de l'échéance.
      2. Niveau 2 (J+{j2}) : ton ferme, rappel des pénalités de retard et de l'indemnité forfaitaire de 40 €.
      3. Niveau 3 (J+{j3}) : mise en demeure avec délai de 8 jours avant transmission au contentieux.
      Objet : « Facture n° [numéro] – relance [niveau] ». Signature : « {signature} ».
    requests:
      fr:
        [
          "Relance le client Durand, sa facture de mars n'est toujours pas réglée.",
          "Prépare un mail pour un impayé de 4 200 € échu depuis trois semaines.",
          "Le client ne répond plus et la facture a 50 jours de retard, que lui envoie-t-on ?",
        ]
      en:
        [
          "Write a reminder to a customer whose invoice is 20 days overdue.",
          "Draft the final notice for an unpaid invoice before we go to collections.",
        ]

  - key: relance-devis
    family: recouvrement
    split: train
    type: procedure
    description:
      {
        fr: "Relance commerciale des devis envoyés restés sans réponse.",
        en: "Sales follow-up on quotes that received no answer.",
      }
    when_to_use:
      {
        fr: "Un prospect n'a pas répondu à un devis.",
        en: "A prospect has not answered a quote.",
      }
    params:
      {
        delai: [5, 7, 10],
        validite: [30, 60],
        signature: ["Équipe commerciale", "Votre conseiller"],
      }
    body: |
      Relancer {delai} jours ouvrés après l'envoi, une seule fois par écrit puis par téléphone.
      Rappeler la date de validité du devis ({validite} jours) et proposer un échange de 15 minutes.
      Ne jamais proposer de remise lors de la première relance. Signature : « {signature} ».
    requests:
      fr:
        [
          "Le prospect n'a pas répondu à notre devis de la semaine dernière, relance-le.",
          "Fais un mail de suivi pour le devis envoyé à la mairie il y a 10 jours.",
        ]
      en:
        [
          "Follow up with a prospect who hasn't replied to our quote.",
          "Nudge the client about the proposal we sent last week.",
        ]

  - key: avoir-client
    family: recouvrement
    split: train
    type: procedure
    description:
      {
        fr: "Émission d'un avoir ou d'un remboursement suite à une erreur de facturation.",
        en: "Issuing a credit note or refund after a billing error.",
      }
    when_to_use:
      {
        fr: "Erreur de facturation, double facturation ou retour produit à rembourser.",
        en: "Billing error, double invoicing or returned goods to refund.",
      }
    params:
      {
        seuil: [500, 1000, 2000],
        valideur:
          ["le contrôleur de gestion", "le DAF", "le responsable comptable"],
      }
    body: |
      Tout avoir supérieur à {seuil} € HT doit être validé par {valideur} avant émission.
      L'avoir référence obligatoirement la facture d'origine et le motif. Délai d'émission : 5 jours ouvrés.
    requests:
      fr:
        [
          "On a facturé deux fois le client Lemoine, comment je régularise ?",
          "Le client a renvoyé la marchandise, il faut lui faire un avoir de 1 800 €.",
        ]
      en:
        [
          "We double-billed a customer, how do I fix it?",
          "Prepare the credit note for the returned order.",
        ]

  - key: demande-achat
    family: achats
    split: train
    type: procedure
    description:
      {
        fr: "Circuit de demande d'achat et de validation des dépenses fournisseurs.",
        en: "Purchase request and spend approval workflow.",
      }
    when_to_use:
      {
        fr: "Un collaborateur veut acheter un bien ou un service.",
        en: "An employee wants to buy goods or services.",
      }
    params: { seuil_devis: [1500, 3000, 5000], seuil_dg: [10000, 25000] }
    body: |
      Au-delà de {seuil_devis} € HT : trois devis comparatifs obligatoires.
      Au-delà de {seuil_dg} € HT : validation du directeur général.
      La demande précise le besoin, le budget imputé, le fournisseur proposé et la date souhaitée.
    requests:
      fr:
        [
          "Je dois acheter 12 ordinateurs portables pour l'équipe, comment je fais ?",
          "Rédige ma demande d'achat pour un logiciel à 6 000 € par an.",
        ]
      en:
        [
          "I need to buy new chairs for the office, what's the process?",
          "Draft a purchase request for a 4,000 euro training course.",
        ]

