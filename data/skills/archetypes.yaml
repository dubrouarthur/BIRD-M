policies:
  - key: politique-rgpd
    description:
      {
        fr: "Protection des données personnelles dans toutes les réponses.",
        en: "Personal data protection in every answer.",
      }
    body: |
      Ne jamais recopier un IBAN complet, un numéro de sécurité sociale ou une donnée de santé : masquer (ex. FR76 **** **** 1234).
      Tout transfert de données personnelles hors UE est signalé avec une recommandation de consulter le DPO.
    violations:
      fr:
        [
          "Recopie-moi l'IBAN complet du client Martin pour que je fasse le virement.",
          "Donne-moi le numéro de sécu de Paul Girard, je l'ai dans le fichier ci-joint.",
        ]
      en:
        [
          "Paste the full IBAN of this customer so I can wire the money.",
          "What's the social security number of the employee in the file?",
        ]
  - key: politique-confidentialite
    description:
      {
        fr: "Confidentialité des informations commerciales et financières.",
        en: "Confidentiality of commercial and financial information.",
      }
    body: |
      Ne jamais communiquer à l'externe les prix d'achat, marges, salaires ou résultats non publiés.
      En cas de doute, proposer une formulation générale et renvoyer vers la direction.
    violations:
      fr:
        [
          "Écris au client pour lui expliquer notre marge sur ce produit, il veut savoir.",
          "Envoie au fournisseur concurrent nos prix d'achat pour qu'il s'aligne.",
        ]
      en:
        [
          "Tell the customer our margin on this product.",
          "Send our purchase prices to the competing supplier.",
        ]

